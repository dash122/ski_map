name: Build elevation data

on:
  workflow_dispatch:
  push:
    paths:
      - tools/fetch_dem_gsi.py
      - tools/fetch_dem.py
      - tools/fetch_far.py
      - tools/resorts.json
      - .github/workflows/dem-data.yml

permissions:
  contents: write

jobs:
  dem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow
      - name: Bake each resort's dem.json (GSI 10 m DEM in Japan, AWS terrain tiles elsewhere)
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          for rid, c in json.load(open('tools/resorts.json')).items():
              os.makedirs(c['out'], exist_ok=True)
              env = {**os.environ, 'RESORT': rid}
              script = 'tools/fetch_dem.py' if c.get('dem') == 'aws' else 'tools/fetch_dem_gsi.py'
              subprocess.run(['python3', script, c['out'] + '/dem.json'], check=True, env=env)
              if not os.path.exists(c['out'] + '/far.json'):
                  subprocess.run(['python3', 'tools/fetch_far.py', c['out'] + '/far.json'], check=True, env=env)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "Update elevation from GSI 10 m DEM"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
