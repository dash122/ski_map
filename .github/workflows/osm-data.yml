name: Fetch OSM ski data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # monthly refresh
  push:
    paths:
      - tools/niseko.overpassql
      - tools/niseko_land.overpassql
      - tools/build_osm.py
      - tools/build_land.py
      - .github/workflows/osm-data.yml

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass
        run: |
          mkdir -p tools/data
          fetch() {
            for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
              if curl -fsS --retry 3 --retry-delay 30 --max-time 600 --data-urlencode "data@$1" "$url" -o "$2"; then return 0; fi
            done
            return 1
          }
          fetch tools/niseko.overpassql tools/data/osm_niseko.json
          sleep 20
          # Land cover, roads, buildings: large, so the raw response stays out of git.
          fetch tools/niseko_land.overpassql "$RUNNER_TEMP/osm_land.json"
          test -s tools/data/osm_niseko.json && test -s "$RUNNER_TEMP/osm_land.json"
      - name: Build public/data/osm.json and land.json
        run: |
          python3 tools/build_osm.py tools/data/osm_niseko.json public/data/osm.json
          python3 tools/build_land.py "$RUNNER_TEMP/osm_land.json" public/data/land.json
          ls -l public/data
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/osm_niseko.json public/data/osm.json public/data/land.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OSM ski and land data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
