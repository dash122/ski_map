name: Fetch OSM ski data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # monthly refresh
  push:
    paths:
      - tools/ski.overpassql
      - tools/land.overpassql
      - tools/resorts.json
      - tools/build_osm.py
      - tools/build_land.py
      - tools/fetch_infrastructure.mjs
      - .github/workflows/osm-data.yml

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh mapped lighting
        continue-on-error: true # Preserve existing lamps if Overpass is unavailable.
        run: |
          RESORT=niseko node tools/fetch_infrastructure.mjs
          RESORT=appi node tools/fetch_infrastructure.mjs
      - name: Query Overpass and build osm.json and land.json for each resort
        run: |
          mkdir -p tools/data
          fetch() {
            # The queries share one area placeholder; tools/resorts.json gives each resort's box as w,s,e,n.
            query=$(python3 -c "import json,sys; w,s,e,n=json.load(open('tools/resorts.json'))['$3']['bbox']; print(open(sys.argv[1]).read().replace('{{bbox}}', f'{s},{w},{n},{e}'))" "$1")
            for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
              if curl -fsS --retry 3 --retry-delay 30 --max-time 600 --data-urlencode "data=$query" "$url" -o "$2"; then return 0; fi
            done
            return 1
          }
          for resort in niseko appi; do
            out=$(python3 -c "import json; print(json.load(open('tools/resorts.json'))['$resort']['out'])")
            mkdir -p "$out"
            fetch tools/ski.overpassql "tools/data/osm_$resort.json" "$resort"
            sleep 20
            # Land cover, roads, buildings: large, so the raw response stays out of git.
            fetch tools/land.overpassql "$RUNNER_TEMP/osm_land_$resort.json" "$resort"
            test -s "tools/data/osm_$resort.json" && test -s "$RUNNER_TEMP/osm_land_$resort.json"
            python3 tools/build_osm.py "tools/data/osm_$resort.json" "$out/osm.json"
            RESORT=$resort python3 tools/build_land.py "$RUNNER_TEMP/osm_land_$resort.json" "$out/land.json"
            ls -l "$out"
            sleep 20
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data public/data
          if ! git diff --cached --quiet; then
            git commit -m "Update OSM ski and land data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
