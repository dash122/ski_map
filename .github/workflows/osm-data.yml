name: Fetch OSM ski data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # monthly refresh
  push:
    paths:
      - tools/niseko.overpassql
      - tools/build_osm.py
      - .github/workflows/osm-data.yml

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass
        run: |
          mkdir -p tools/data
          for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            if curl -fsS --retry 3 --retry-delay 20 --data-urlencode "data@tools/niseko.overpassql" "$url" -o tools/data/osm_niseko.json; then break; fi
          done
          test -s tools/data/osm_niseko.json
      - name: Build public/data/osm.json
        run: python3 tools/build_osm.py tools/data/osm_niseko.json public/data/osm.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/osm_niseko.json public/data/osm.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OSM ski data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
